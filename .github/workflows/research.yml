name: Refresh research
on:
  workflow_dispatch:
  push:
    paths: ['research/**', 'tests/**', '.github/workflows/research.yml']
  schedule:
    - cron: '23 */4 * * 1-5'
permissions:
  contents: write
concurrency:
  group: research-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python research/refresh.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Save observations
        run: |
          git config user.name 'whale-edge-bot'
          git config user.email 'whale-edge-bot@users.noreply.github.com'
          git add dist/data.json data/observations
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh source-backed research snapshot'
            git push
          fi
